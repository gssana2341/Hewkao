<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEWKAO — หิวข้าว วันนี้กินอะไรดี</title>
<meta name="description" content="สุ่มร้านอาหารใกล้คุณ คิดไม่ออกว่าจะกินอะไร ให้ HEWKAO ช่วยสุ่มให้">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icons/favicon-96.png" sizes="96x96" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="subscription.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="checkin.css">
</head>
<body>

<!-- 1. Splash -->
<div id="splash" class="splash">
  <img src="assets/logo-full.png" alt="HEWKAO" class="splash-logo" width="200" height="183">
  <p class="splash-text">จะกินอะไรดี คิดไม่ออก?</p>
  <p class="splash-sub" id="splashSub">กำลังค้นหาตำแหน่งของคุณ…</p>
  <button id="splashRetryBtn" class="btn btn-primary splash-retry-btn" hidden>ลองอีกครั้ง</button>
</div>

<!-- 2. Main app -->
<div id="app" class="app" hidden>
  <div id="map" class="map"></div>

  <div class="top-bar">
    <div class="brand-chip">
      <img src="assets/logo-horizontal.png" alt="HEWKAO" class="brand-logo" width="65" height="24">
    </div>
    <button id="profileBtn" class="icon-btn" aria-label="โปรไฟล์" title="โปรไฟล์">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6"/>
        <path d="M4.5 20c1.4-3.8 4.6-6 7.5-6s6.1 2.2 7.5 6"/>
      </svg>
    </button>
  </div>

  <div id="listPanel" class="list-panel">
    <div class="list-handle" id="listHandle" role="button" tabindex="0" aria-label="ลากเพื่อดูรายชื่อร้าน"><span></span></div>
    <div class="list-header">
      <h2>ร้านใกล้คุณ</h2>
      <span id="listCount" class="list-count">กำลังค้นหา…</span>
    </div>
    <div id="restaurantList" class="restaurant-list"></div>
  </div>

  <button id="listToggleBtn" class="icon-btn list-toggle-btn" aria-label="ซ่อนรายการร้าน" title="ซ่อน/แสดงรายการร้าน">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 6 9 12 15 18"/>
    </svg>
  </button>

  <div class="map-controls">
    <button id="prefsBtn" class="icon-btn" aria-label="ตั้งค่าการค้นหา" title="ตั้งค่าการค้นหา">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.3 3.2c.4-1.6 2.8-1.6 3.2 0a1.7 1.7 0 0 0 2.5 1c1.4-.8 3 .8 2.2 2.2a1.7 1.7 0 0 0 1 2.5c1.6.4 1.6 2.8 0 3.2a1.7 1.7 0 0 0-1 2.5c.8 1.4-.8 3-2.2 2.2a1.7 1.7 0 0 0-2.5 1c-.4 1.6-2.8 1.6-3.2 0a1.7 1.7 0 0 0-2.5-1c-1.4.8-3-.8-2.2-2.2a1.7 1.7 0 0 0-1-2.5c-1.6-.4-1.6-2.8 0-3.2a1.7 1.7 0 0 0 1-2.5c-.8-1.4.8-3 2.2-2.2.9.5 2.1.1 2.5-1Z"/>
        <circle cx="12" cy="12" r="3.2"/>
      </svg>
    </button>

    <button id="layerBtn" class="icon-btn layer-btn" aria-label="สลับรูปแบบแผนที่" title="รูปแบบแผนที่">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
    </button>

    <button id="spinBtn" class="spin-btn" disabled>
      <span class="spin-btn-dice" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span>สุ่มร้าน</span>
    </button>

    <button id="locateBtn" class="icon-btn locate-btn" aria-label="กลับไปตำแหน่งของฉัน" title="ตำแหน่งของฉัน">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </button>
  </div>
</div>

<!-- 3. Spin overlay -->
<div id="spinOverlay" class="spin-overlay" hidden>
  <div class="spin-frame">
    <div class="spin-fade spin-fade-top"></div>
    <div class="spin-track" id="spinTrack"></div>
    <div class="spin-fade spin-fade-bottom"></div>
  </div>
</div>

<!-- 4. Result bottom sheet -->
<div id="resultBackdrop" class="result-backdrop" hidden></div>
<div id="resultSheet" class="result-sheet" role="dialog" aria-modal="true" aria-labelledby="resultName" hidden>
  <button id="resultCloseBtn" type="button" class="icon-btn sheet-close" aria-label="ปิด" title="ปิด">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6 6 18"/>
    </svg>
  </button>
  <div class="result-scroll">
    <div class="sheet-handle"><span></span></div>
    <figure id="resultPhotoWrap" class="result-photo-wrap" hidden>
      <img id="resultPhoto" class="result-photo" alt="">
      <a id="resultPhotoCredit" class="result-photo-credit" target="_blank" rel="noopener" hidden></a>
    </figure>
    <div class="result-content">
      <span class="result-badge" id="resultCuisine">อาหารทั่วไป</span>
      <h2 id="resultName">ชื่อร้าน</h2>
      <p id="resultMeta" class="result-meta" hidden></p>
      <p id="resultAddress" class="result-address" hidden></p>
      <p id="resultDistance" class="result-distance">ห่างออกไป —</p>
      <a id="resultTel" class="result-tel" href="#" hidden></a>
      <a id="resultMapsLink" class="result-maps-link" href="#" target="_blank" rel="noopener" hidden>
        ดูรีวิวและรูปเพิ่มบน Google Maps
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/>
        </svg>
      </a>
      <div id="resultMethods" class="chips result-methods" hidden></div>
    </div>
  </div>
  <div class="result-actions">
    <button id="respinBtn" type="button" class="btn btn-secondary">สุ่มใหม่</button>
    <button id="goBtn" type="button" class="btn btn-primary">เริ่มเดินทาง</button>
  </div>
</div>

<!-- 5. Preferences modal -->
<div id="prefsModal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="prefsTitle">
    <h3 id="prefsTitle">ตั้งค่าการค้นหา</h3>
    <p class="modal-sub">ปรับระยะค้นหาและร้านที่ไม่นับรวมตอนสุ่ม</p>

    <p class="prefs-label">ระยะค้นหา</p>
    <div id="radiusChips" class="chips"></div>

    <div id="openNowChips" class="chips"></div>

    <p class="prefs-label">ประเภทที่ไม่ชอบ (ไม่นับรวมตอนสุ่ม)</p>
    <div id="prefsChips" class="chips"></div>

    <div class="modal-actions">
      <button id="prefsClose" class="btn btn-secondary">ปิด</button>
      <button id="prefsSave" class="btn btn-primary">บันทึก</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
